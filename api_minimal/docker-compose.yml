version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: social_media_api_db
    environment:
      POSTGRES_USER: ${DB_USER:-social_media}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-social_media_api}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-social_media}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social_media_network

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: social_media_api_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - social_media_network

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social_media_api_app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-social_media}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-social_media_api}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_password}
      API_URL: ${API_URL:-http://localhost:3000}
      PROXY_LIST: ${PROXY_LIST:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - social_media_network
    restart: unless-stopped

  # Optional: pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: social_media_api_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - '5050:80'
    depends_on:
      - postgres
    networks:
      - social_media_network
    restart: unless-stopped

  # Optional: Redis Commander for Redis Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: social_media_api_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_secure_password}
    ports:
      - '8081:8081'
    depends_on:
      - redis
    networks:
      - social_media_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  social_media_network:
    driver: bridge
